<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ignite The Zohar — Donate Now</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bangers&family=Righteous&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Main Content -->
  <div class="page-container">

    <!-- Two-Column Hero -->
    <section class="hero">

      <!-- Left: Visuals -->
      <div class="hero-left">

        <!-- Top Banner: Disco Zohar -->
        <div class="banner-card">
          <div class="banner-content">
            <h2 class="banner-title">Awakening the light of the Zohar: printing a new set</h2>
          </div>
        </div>



      </div>

      <!-- Right: Donation Widget -->
      <div class="hero-right">

        <div class="donate-widget">
          <h2 class="widget-title">Help us reach our goal!</h2>

          <!-- Amount Display -->
          <div class="amount-display">
            <div class="amount-pill">
              <span class="amount-value" id="amount-raised">$5,000</span>
            </div>
            <div class="amount-goal-text">
              <span class="raised-label">RAISED</span> of <span class="goal-number" id="goal-amount">$72,000</span> goal
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="progress-section">
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progress-fill">
                <div class="progress-cap"></div>
              </div>
            </div>
            <div class="progress-labels">
              <span class="progress-pct" id="progress-pct">7%</span>
              <span class="progress-goal" id="progress-goal-label">$72,000</span>
            </div>
          </div>

          <!-- Donate Button -->
          <a href="https://your-donation-link.example.com" class="btn-donate" id="donate-btn">
            DONATE NOW
          </a>

          <!-- Recent Donations -->
          <div class="recent-donations">
            <h3 class="donations-title">Recent Donations</h3>
            <div class="donations-list" id="donations-list">
              <div class="donation-entry">
                <div class="donation-avatar" style="--avatar-color: #2196f3;">SL</div>
                <div class="donation-info">
                  <span class="donation-name">Sarah L.</span>
                  <span class="donation-comment">"So excited for this!"</span>
                </div>
              </div>
              <div class="donation-entry">
                <div class="donation-avatar" style="--avatar-color: #00bcd4;">BG</div>
                <div class="donation-info">
                  <span class="donation-name">Ben G.</span>
                  <span class="donation-comment">"A beautiful cause."</span>
                </div>
              </div>
              <div class="donation-entry">
                <div class="donation-avatar" style="--avatar-color: #ff9800;">MP</div>
                <div class="donation-info">
                  <span class="donation-name">Maria P.</span>
                  <span class="donation-comment">"Let's make it happen!"</span>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>



  </div>

  <script src="app.js"></script>
</body>
</html>
